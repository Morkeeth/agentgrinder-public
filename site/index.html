<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__BRAND__ · __TAGLINE__</title>
<meta name="description" content="Turn a Cursor, Grok Bot, Claude Code or Codex session into a run card. Post your runs and see what other builders are making. Private until you choose to share.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
<style>
/* AGENT GRINDER — one family (IBM Plex Sans 400/500/600), five sizes (11 13 14 20 28),
   one accent (#0047ff) where it carries meaning, hairlines, square corners, no shadows,
   no gradients, no monospace. docs/design/REFERENCE-2026-09-03.html is the law. */

*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;font-weight:400;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
a:hover{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;color:var(--dim);font-weight:400;display:block}
.meta,.hint{font-size:13px;color:var(--soft);font-weight:400}

/* buttons — only an action may look like one */
button{font-family:inherit;font-size:13px;font-weight:500;line-height:1;border-radius:2px;
  padding:8px 14px;cursor:pointer;background:var(--ink);color:#fff;border:1px solid var(--ink)}
button:hover{background:#000;border-color:#000}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.ghost,.act{background:none;color:var(--ink);border:1px solid var(--rule)}
button.ghost:hover,.act:hover{background:var(--rule-2);border-color:var(--rule)}
.act{font-family:inherit;font-size:13px;font-weight:500;line-height:1;border-radius:2px;padding:7px 12px;cursor:pointer}
.act.blue{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-wash)}
.act.blue:hover{background:#e9efff}
.act.on{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-wash)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:1320px;margin:0 auto;padding:0 24px;height:54px;display:flex;align-items:center;gap:26px}
.mark{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.mark i{color:var(--blue);font-style:normal}
.bar nav{display:flex;gap:20px;font-size:13px;color:var(--soft);min-width:0;overflow:visible;align-items:center;flex-wrap:wrap}
.bar nav a{white-space:nowrap}
.bar nav a.on,[aria-current=page]{color:var(--ink);font-weight:500}
.nav-badge{display:inline-block;min-width:8px;height:8px;margin-left:6px;border-radius:50%;background:var(--blue, #123cff);vertical-align:middle}
.nav-badge[hidden]{display:none}
.account-menu{position:relative}
.account-menu>summary{list-style:none;cursor:pointer;color:var(--soft);font-size:13px}
.account-menu>summary::-webkit-details-marker{display:none}
.account-menu[open]>summary,.account-menu>summary:hover{color:var(--ink)}
.account-panel{position:absolute;right:0;top:calc(100% + 8px);min-width:180px;background:var(--card, var(--bg));border:1px solid var(--line, var(--rule));padding:8px;z-index:40;display:grid;gap:4px}
.account-panel a{display:block;padding:8px 10px;color:var(--ink);text-decoration:none}
.account-panel a:hover{background:var(--bg)}
.feed-tabs,.section-tabs{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 18px;font-size:14px}
.feed-tabs a,.section-tabs a{color:var(--soft);text-decoration:none}
.feed-tabs a.on,.section-tabs a.on,[aria-current=page].tab{color:var(--ink);font-weight:600}
.community-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.community-grid a{display:block;padding:18px;border:1px solid var(--line, var(--rule));text-decoration:none;color:inherit;overflow-wrap:anywhere}
@media(max-width:700px){.community-grid{grid-template-columns:1fr}}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--soft);white-space:nowrap}
.bar .right .you{color:var(--ink);font-weight:500}
.bar .right button{padding:7px 12px}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding:0 24px;display:grid;
  grid-template-columns:172px minmax(0,1fr) 276px;align-items:start}
.rail{border-right:1px solid var(--rule);padding:24px 22px 60px 0;position:sticky;top:54px}
.rail .lbl{margin:20px 0 8px}
.rail .lbl:first-child{margin-top:0}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:5px 0;color:var(--soft);font-size:13px}
.rail a.on{color:var(--ink);font-weight:500}
.rail a span{color:var(--dim)}
.main{padding:24px 24px 90px;border-right:1px solid var(--rule);min-width:0}
.side{padding:24px 0 90px 22px;position:sticky;top:54px}
.shell.norail{grid-template-columns:minmax(0,1fr) 276px}
.shell.norail .rail{display:none}
.shell.norail .main{padding-left:0}
.shell.noside{grid-template-columns:172px minmax(0,1fr)}
.shell.noside .side{display:none}
.shell.noside .main{border-right:0;padding-right:0}
.shell.norail.noside,.shell.solo{grid-template-columns:minmax(0,1fr)}
.shell.solo .rail,.shell.solo .side{display:none}
.shell.norail.noside .main,.shell.solo .main{border-right:0;padding:24px 0 90px;max-width:760px;margin:0 auto}
.shell.wide.norail.noside .main,.shell.wide.solo .main,.shell.wide .main{max-width:1240px}
.rail .r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;color:var(--soft);font-size:13px}
.rail .r span{color:var(--dim)}

#status{max-width:1320px;margin:0 auto;padding:10px 24px 0;color:var(--soft);font-size:13px}
#status.err{color:var(--ink);font-weight:500}

/* section heads */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:0 0 12px}
.head h2{font-size:14px;font-weight:600;margin:0}
h2.sec{font-size:14px;font-weight:600;margin:28px 0 12px;padding:0}
h2.sec:first-child{margin-top:0}
h3{font-size:14px;font-weight:600;margin:0 0 10px}

/* upload — the first thing on the page */
.up{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.up-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.up-top .t{font-size:14px;font-weight:600}
.up-top .meta{margin-left:auto}
.cmd{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule-2)}
.cmd .c{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.5;word-break:break-word}
.cmd .d{font-size:13px;color:var(--soft);flex:none}
.up-foot{padding:11px 16px;font-size:13px;color:var(--soft)}
.cmd .c.plain{font-weight:400;color:var(--soft)}
.cmd a.d{color:var(--blue)}
a.act{display:inline-block;text-decoration:none}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 28px}
.cta .hint{flex-basis:100%;margin-top:2px}

/* the coach, running */
.check{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.check-top{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.check-top .t{font-size:14px;font-weight:500}
.check-top .s{margin-left:auto;font-size:13px;color:var(--soft)}
.step{display:grid;grid-template-columns:14px 122px minmax(0,1fr);gap:12px;align-items:baseline;
  padding:9px 16px;border-bottom:1px solid var(--rule-2);font-size:13px;opacity:.3;
  transition:opacity .28s ease}
.step:last-child{border-bottom:0}
.step.done{opacity:1}
.step .i{width:6px;height:6px;border:1px solid var(--dim);border-radius:50%;transform:translateY(-1px)}
.step.done .i{background:var(--blue);border-color:var(--blue)}
.step .n{font-weight:500}
.step .o{color:var(--soft)}

/* run card */
.card{background:var(--box);border:1px solid var(--rule);margin-bottom:14px}
.c-top,.runtop{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
/* THE MARK IS THE GRIND. Brand book section 6: the mark is generative, the rhythm of a real
   session drawn as a profile line, so the logo is never a stock glyph. The avatar is that tile:
   a square hairline box holding the account's own newest grind trace. No letter, no image, no
   emoji, no gradient. An account with no run draws a flat line, deliberately empty. */
.av{width:26px;height:26px;border:1px solid var(--rule);display:block;flex:none;
  position:relative;background:var(--box)}
.av svg{display:block;width:100%;height:100%}
.trace{fill:none;stroke:var(--ink);stroke-width:1;stroke-linejoin:round;stroke-linecap:round}
/* no run yet: a flat line, the same dash this design already prints for a number nobody
   measured. Your mark appears when you post your first grind. */
.trace.empty{stroke:var(--dim)}
/* an agent account is marked by a rule the design already uses, not a new colour or a badge */
.av.agent::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--ink)}
.who a,.who span{font-size:14px;font-weight:500}
.who small{display:block;font-size:13px;color:var(--dim);font-weight:400}
.who small a{color:var(--dim)}
.state{margin-left:auto;font-size:13px;color:var(--blue);font-weight:500}
.state.off{color:var(--dim);font-weight:400}
.c-title,.title{font-size:14px;font-weight:500;padding:14px 16px 0}
.sub{padding:4px 16px 0;font-size:13px;color:var(--soft)}
.card-harness{color:var(--ink);font-weight:500}
.note{padding:8px 16px 0;font-size:14px;line-height:1.55}
.grp{padding:14px 16px 0;font-size:11px;color:var(--dim)}
.para{padding:6px 16px 0;font-size:14px;line-height:1.6}
.plan{margin:6px 16px 0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--soft)}
.rule-line{margin:12px 16px 0;padding-left:12px;border-left:1px solid var(--blue);font-size:13px;line-height:1.55}

/* the headline stat, then the boxed grid */
.hl{display:flex;align-items:baseline;gap:12px;padding:14px 16px 0;cursor:help}
.hl .n{font-size:28px;font-weight:500;line-height:1;color:var(--blue);letter-spacing:-.02em}
.hl .k{font-size:11px;color:var(--dim)}
.boxes,.fiverow{display:grid;grid-template-columns:repeat(5,1fr);background:var(--rule);gap:1px;
  border-top:1px solid var(--rule);margin-top:14px}
.bx,.five{background:var(--box);padding:12px 14px;min-width:0}
.bx .lbl,.five .k{font-size:11px;color:var(--dim);line-height:1.3}
.bx .v,.five .v{font-size:20px;font-weight:500;margin-top:6px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx .v span,.five .v span{font-size:13px;color:var(--soft);font-weight:400}
.bx.hero .v{color:var(--blue)}
.five[data-missing] .v{color:var(--dim);font-weight:400}
.costtag{font-style:normal;color:var(--dim);margin-left:4px}

/* trace */
.tw{padding:12px 16px 0}
.tw svg{display:block;width:100%;height:60px}
.tl{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .tl{stroke-dasharray:3400;stroke-dashoffset:3400;animation:draw 1.1s cubic-bezier(.25,.7,.3,1) .15s forwards}
}
@keyframes draw{to{stroke-dashoffset:0}}
.tl.grey{stroke:#c6c6c1}
.base{stroke:var(--rule-2);stroke-width:1}
.curve{display:block;width:100%;height:60px}

/* card foot */
.c-foot,.foot{display:flex;flex-wrap:wrap;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--rule);
  align-items:center;margin-top:14px;font-size:13px;color:var(--soft)}
.c-foot .acts,.foot .acts{margin-left:auto;display:flex;gap:8px}
.run-continuation{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px 0}
.run-continuation .acts{display:flex;flex-wrap:wrap;gap:8px}
.run-primary-actions{border-left:2px solid var(--blue);padding:14px 16px;margin:0 0 24px;background:var(--box)}
.run-primary-actions p{margin:0 0 10px}
.run-primary-actions .cta{margin:0}
.run-primary-actions .hint{margin:10px 0 0}

/* skeleton — one shot, resolves into real content */
.sk{background:linear-gradient(90deg,#eeeeeb 25%,#f6f6f4 37%,#eeeeeb 63%);background-size:400% 100%;
  animation:sh 1.25s ease infinite;border-radius:2px;display:block}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk.l{height:9px;margin:7px 0}
.fade{opacity:0;transition:opacity .3s ease}
.fade.in{opacity:1}

/* side panels */
.panel{border:1px solid var(--rule);background:var(--box);margin-bottom:14px}
.p-top{padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
  align-items:baseline;gap:10px}
.p-top .t{font-size:14px;font-weight:600}
.p-row,.flex-row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px}
.p-row:last-child,.flex-row:last-child{border-bottom:0}
.p-row .v{color:var(--soft);min-width:0;overflow-wrap:anywhere;text-align:right}
.p-row .v b{color:var(--ink);font-weight:500}
.p-row .v.never{color:var(--ink);font-weight:500}
.g-row{padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:13px;display:block}
.g-row:last-child{border-bottom:0}
.pad{padding:14px 16px}
.panel .pad h3{margin:0 0 8px}

/* forms */
label{display:block;font-size:11px;color:var(--dim);margin:0 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:13px;background:var(--box);color:var(--ink);
  border:1px solid var(--rule);border-radius:0;padding:9px 11px;margin-bottom:10px}
input[type=checkbox]{width:auto;margin:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
.row{display:flex;gap:10px}.row>*{flex:1}
.empty{color:var(--soft);padding:36px 16px;line-height:1.7;font-size:13px}
footer{max-width:1320px;margin:0 auto;padding:20px 24px 40px;color:var(--dim);font-size:13px;
  border-top:1px solid var(--rule)}

/* onboarding */
.steps{display:flex;gap:5px;margin:0 0 18px}
.steps span{flex:1;height:2px;background:var(--rule)}
.steps span.on,.steps span.done{background:var(--blue)}
.ob-step{background:var(--box);border:1px solid var(--rule);padding:16px;margin-bottom:12px}
.ob-step h3{margin:0 0 8px}
.ob-step .cmd{border:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:10px 0;
  padding:11px 13px;word-break:break-word}
.ob-step .cmd .c{white-space:normal;overflow:visible}
.ob-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.preview-story>p:first-child{margin-top:0}
.preview-details,.profile-summary{border-top:1px solid var(--rule);margin-top:18px;padding-top:14px}
.preview-details>summary,.profile-summary>summary{cursor:pointer;color:var(--soft);font-size:13px;min-height:40px}
.preview-details[open]>summary,.profile-summary[open]>summary{color:var(--ink);font-weight:500;margin-bottom:14px}
.profile-context{color:var(--soft);font-size:13px;margin:0 0 18px}

/* ack picker */
.ack-picker{padding:12px 16px 14px;border-top:1px solid var(--rule)}
.ack-picker p{margin:0 0 10px;font-size:13px;color:var(--soft)}
.ack-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ack-chip{font-family:inherit;font-size:13px;font-weight:500;padding:7px 11px;border-radius:2px;
  border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer;text-align:left}
.ack-chip.on{border-color:var(--blue-soft);background:var(--blue-wash);color:var(--blue)}
.ack-chip small{display:block;font-weight:400;color:var(--dim);font-size:11px;margin-top:2px}
.ack-list{padding:0}
.ack-row{display:flex;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--rule-2);font-size:13px}
.ack-row b{font-weight:500}
.ack-row span{color:var(--soft)}

/* profile head */
.phero{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.phero .av{width:36px;height:36px}
.phero h1{margin:0;font-size:14px;font-weight:600}
.phero .h{color:var(--soft);font-size:13px}
.ptotals{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));background:var(--rule);gap:1px;
  border:1px solid var(--rule);margin:0 0 16px}
.ptotals>div{background:var(--box);padding:12px 14px;min-width:0}
.ptotals .v{font-size:20px;font-weight:500;margin-top:6px;line-height:1.1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ptotals .k{font-size:11px;color:var(--dim)}
.ptotals .hero .v{color:var(--blue)}

/* bingo — labels, not buttons */
.bingo{display:grid;grid-template-columns:repeat(3,1fr);background:var(--rule);gap:1px;
  border:1px solid var(--rule);margin-bottom:16px}
.bingo-cell{background:var(--box);padding:11px 12px;font-size:13px;color:var(--dim)}
.bingo-cell.on{color:var(--blue);font-weight:500}

/* share card — flat, hairline, no ticket stub */
.share-scene{padding:0 0 20px}
.share-scale{width:100%;max-width:1200px;margin:0 auto;overflow:hidden}
.share-frame{width:1200px;height:630px;transform-origin:top left;background:var(--box);
  border:1px solid var(--rule);display:flex;flex-direction:column;color:var(--ink)}
.share-main{flex:1;display:grid;grid-template-columns:1fr 1.05fr;min-height:0}
.share-left{padding:44px 40px;display:flex;flex-direction:column;justify-content:flex-start;
  border-right:1px solid var(--rule)}
.share-left>div{margin:auto 0}
.share-brand{font-size:14px;font-weight:600}
.share-brand i{color:var(--blue);font-style:normal}
.share-handle-row{display:flex;align-items:center;gap:16px;margin-top:26px}
.share-av{width:56px;height:56px}
.share-handle{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.share-stamp{font-size:13px;font-weight:500;color:var(--blue);margin-top:4px}
.share-lead{margin-top:24px;font-size:20px;font-weight:500;letter-spacing:-.01em}
.share-sub{margin-top:6px;font-size:13px;color:var(--soft);line-height:1.55;max-width:420px}
.share-right{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.share-hero{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.share-hero .n{font-size:28px;font-weight:500;letter-spacing:-.02em;color:var(--blue);line-height:1}
.share-hero .k{font-size:11px;color:var(--dim)}
.share-hl{font-size:14px;font-weight:400;line-height:1.55;margin:12px 0 16px;padding-left:12px;
  border-left:1px solid var(--blue)}
.share-stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--rule);gap:1px;
  border:1px solid var(--rule);margin-top:16px}
.share-stats .stat{background:var(--box);padding:12px 14px}
.share-stats .v{font-size:20px;font-weight:500;margin-top:6px;line-height:1.1}
.share-stats .k{font-size:11px;color:var(--dim)}
.share-curve{margin:8px 0 14px}
.share-curve svg{display:block;width:100%}
.share-roast{margin:10px 0;padding-left:12px;border-left:1px solid var(--rule);font-size:13px;
  color:var(--soft);line-height:1.55}
.share-roast ul{margin:6px 0 0 16px;padding:0}
.share-foot{border-top:1px solid var(--rule);padding:0 40px;height:88px;display:flex;
  align-items:center;justify-content:space-between}
.share-foot .cta{font-size:20px;font-weight:500;letter-spacing:-.01em}
.share-foot .cta span{color:var(--blue)}
.share-foot .url{font-size:13px;color:var(--soft)}
.share-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* run-card extras */
.vibe-chip{font-size:13px;color:var(--soft);font-weight:400;margin-left:8px}
.ghost-tag{font-size:13px;color:var(--dim);margin-left:6px}
.rig-chips{display:block;font-size:13px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--rule);gap:1px;
  border-top:1px solid var(--rule);margin-top:14px}
.stat{background:var(--box);padding:12px 14px;min-width:0}
.stat .v{font-size:20px;font-weight:500;margin-top:6px;line-height:1.1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.stat .v i{font-style:normal;font-size:13px;font-weight:400;color:var(--soft)}
.stat .k{font-size:11px;color:var(--dim);line-height:1.3}

@media (max-width:1180px){
  .shell{grid-template-columns:172px minmax(0,1fr)}
  .shell.norail,.shell.norail.noside,.shell.solo{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{border-right:0;padding-right:0}
}
@media (max-width:900px){

<script>
const SB_URL="http://127.0.0.1:54321";
const SB_KEY="local-development-only";
const SB_SCHEMA="strava";
// The home count is always read from this deployment. A failed read stays unknown.
async function fetchPublicRunCount(){
  if(!sb) return null;
  try{
    const {count,error}=await sb.from('runs').select('id',{count:'exact',head:true}).eq('visibility','public');
    if(error) return null;
    return Number.isInteger(count)?count:null;
  }catch(_){ return null; }
}
const $=id=>document.getElementById(id);
// THE SHELL. rail | feed | side. A view that has no rail or no side column says so and the grid
// closes up; nothing in the rail or the side is drawn from anything but a row this page fetched.
function frame(rail,side,wide){
  const sh=$('shell'); if(!sh) return;
  $('rail').innerHTML=rail||''; $('side').innerHTML=side||'';
  sh.className='shell'+(rail?'':' norail')+(side?'':' noside')+(wide?' wide':'');
}
function projectStats(runs){
  const by={};
  (runs||[]).forEach(r=>{ if(!r.project) return;
    const v=by[r.project]||(by[r.project]={n:0,num:0,den:0}); v.n++;
    if(r.claims_verified!=null&&r.artifacts_produced!=null&&r.prompts){ v.num+=r.claims_verified+r.artifacts_produced; v.den+=r.prompts; } });
  return Object.entries(by).map(([name,v])=>({name,n:v.n,vpt:v.den?(v.num/v.den).toFixed(2):null}))
    .sort((a,b)=>b.n-a.n).slice(0,6);
}
function railHtml(active,runs){
  const a=(href,label,on,count)=>`<a href="${href}"${on?' class="on"':''}>${esc(label)}${count!=null?`<span>${count}</span>`:''}</a>`;
  let o='<p class="lbl">Primary</p>'+a('/?explore','Feed',active==='feed'||active==='following',(runs&&runs.length)||null);
  o+=a('/?post','Post a run',active==='post');
  if(ME) o+=a('/?mine','My runs',active==='me')+a('/?inbox','Responses',active==='inbox');
  o+='<p class="lbl">About</p>'+a('/privacy','Privacy')+a('/terms','Terms');

}
function setPrimarySection(section){

}

}
function communityTabs(active){

  $('app').innerHTML=`${communityTabs('hub')}<div class="head"><h1>Community</h1><span class="meta">Techniques you can try, then attempts and outcomes</span></div>
    <p>Start from a useful practice, keep it on your own baseline, and share an observed outcome. ACKs and Scrapbooks still live on the people who earned them.</p>
    <div id="community-techniques"><p class="hint">Loading public techniques…</p></div>
    <div class="community-grid">
      <a href="/?forum"><strong>Forum</strong><p class="meta">Discover runs and replies</p></a>
      <a href="/?crews"><strong>Crews</strong><p class="meta">Grind with people you trust</p></a>
      <a href="/?challenges"><strong>Challenges</strong><p class="meta">Time-bound events and Rigs</p></a>
    </div>`;
  try{
    const rows=await sb.from('grinder_practice_versions').select('id,title,instruction,expected,harness,visibility,created_at').eq('visibility','public').order('created_at',{ascending:false}).limit(8);
    const list=rows.data||[];
    const slot=$('community-techniques');
    if(!slot) return;
    slot.innerHTML=list.length
      ? `<div class="head"><h2>Techniques to try</h2><span class="meta">${list.length} public</span></div>`+list.map(p=>`<article class="card"><small>${esc(p.harness||'Any harness')}</small><h3><a href="/?practice=${p.id}">${esc(p.title)}</a></h3><p>${esc(p.instruction)}</p><p class="hint">Expected: ${esc(p.expected)}</p><a class="act" href="/?practice=${p.id}">Try this on your own baseline</a></article>`).join('')
      : `<p class="hint">No public techniques on this deployment yet. The <a href="/?example">bundled example</a> shows the path without inventing users.</p>`;
  }catch(_){
    const slot=$('community-techniques');
    if(slot) slot.innerHTML='<p class="hint">Public techniques are unavailable on this deployment. Forum, Crews and Challenges below still work.</p>';
  }
}
function sidePanels(runs,opts){
  opts=opts||{};
  const ps=projectStats(runs);
  const proj=ps.length?`<div class="panel"><div class="p-top"><span class="t">${opts.mine?'Your projects':'Projects'}</span><span class="lbl" style="white-space:nowrap">verified per turn</span></div>
    ${ps.map(x=>`<div class="p-row"><span>${esc(x.name)}</span><span class="v">${x.vpt?`<b>${x.vpt}</b>`:'no verdict yet'}</span></div>`).join('')}</div>`:'';
  return proj+`<div class="panel"><div class="p-top"><span class="t">What leaves your machine</span></div>
    <div class="p-row"><span>Counts and timings</span><span class="v">shared</span></div>
    <div class="p-row"><span>Coach notes and caption</span><span class="v">review first</span></div>
    <div class="p-row"><span>Your prompts</span><span class="v never">never</span></div>
    <div class="p-row"><span>Code and file paths</span><span class="v never">never</span></div>
    <div class="p-row"><span>Bedrock coach</span><span class="v">optional network mode</span></div></div>
  <div class="panel"><div class="p-top"><span class="t">Read</span></div>
    <a class="g-row" href="/methodology">How every number on a card is made</a>
    <a class="g-row" href="/privacy">What leaves your machine, in full</a>
    <a class="g-row" href="/terms">Terms</a></div>`;
}
function skeletonCard(){
  const bx='<div class="bx"><span class="sk l" style="width:42px;height:7px"></span><span class="sk l" style="width:30px;height:15px"></span></div>';
  return `<div class="card"><div class="runtop"><span class="av"></span><div style="flex:1">
      <span class="sk l" style="width:110px"></span><span class="sk l" style="width:160px;height:7px"></span></div></div>
    <div style="padding:14px 16px 0"><span class="sk l" style="width:58%;height:12px"></span></div>
    <div class="boxes">${bx.repeat(5)}</div>
    <div class="tw"><span class="sk" style="height:60px"></span></div></div>`;
}
const status=(m,e)=>{const s=$('status');s.textContent=m||'';s.className=e?'err':'';};
if(!window.supabase) status("Couldn't load, refresh.",true);
// Link-only reads carry the ID the visitor opened; collection reads cannot enumerate them.
async function grinderFetch(input, options={}){
  const headers=new Headers(options.headers || (input instanceof Request ? input.headers : undefined));
  const runId=new URLSearchParams(location.search).get('run');
  if(runId && /^[a-f0-9-]{36}$/i.test(runId)) headers.set('x-grinder-run-id',runId);
  return fetch(input,{...options,headers});
}
const sb=window.supabase&&window.supabase.createClient(SB_URL,SB_KEY,{db:{schema:SB_SCHEMA},auth:{storageKey:"agentic-strava-auth"},global:{fetch:grinderFetch}});
const auth=sb?GrinderAuth.create({client:sb,redirectTo:location.origin+'/'}):null;
const PROVIDERS_ENABLED=["github","email"];
const profileHandle=p=>GrinderAuth.present(p)?.handle||'';
// A person who arrived from Responses keeps a way back even when the run is gone or private.
function responseReturnLink(){try{return sessionStorage.getItem('ag_response_return')==='?inbox'?'<p class="response-return"><a class="act" href="/?inbox">Back to Responses</a></p>':''}catch(_){return ''}}
let ME=null, IDENTITY_SETUP=null;
const social=GrinderSocial({client:sb,me:()=>ME,app:()=>$('app'),frame,status,
  renderRuns:async runs=>{noteTraces(runs);const ad=await ackData(runs);setTimeout(()=>{wireKudos();countUp()},0);return runs.map(r=>runCard(r,ad.mine.has(r.id),ad.counts[r.id])).join('')}});
const people=GrinderPeople({client:sb,me:()=>ME,app:()=>$('app'),frame,status,social,drawAvatar:avatar,renderRuns:async runs=>{noteTraces(runs);const ad=await ackData(runs);setTimeout(()=>{wireKudos();countUp()},0);return runs.map(r=>runCard(r,ad.mine.has(r.id),ad.counts[r.id])).join('')}});
const practices=GrinderPractices({client:sb,me:()=>ME,app:()=>$('app'),frame,status});
const progress=GrinderProgress({client:sb,me:()=>ME,app:()=>$('app'),frame,status,signIn:showSignIn});
const challenges=GrinderChallenges({client:sb,me:()=>ME,app:()=>$('app'),frame,status});
// No connector is supplied until an Origin application and callback are registered and reviewed.
// Origin remains a post-sign-in repository connection, never an Auth provider.
const originConnection=GrinderOrigin.create();
const account=GrinderAccount({auth,me:()=>ME,app:()=>$('app'),frame,status,providersEnabled:PROVIDERS_ENABLED,origin:originConnection,signIn:showSignIn,onProfileChange:p=>{ME=p;refreshAuth();}});

// THE MARK IS THE GRIND, drawn small.
//
// Brand book section 6: "The mark is generative: the grind trace, the rhythm of a real session
// drawn as a profile line. Every grind has a different shape, so the logo is never a stock
// glyph." An initial in a circle was a stock glyph, so the avatar is now the account's own
// newest grind rhythm, hairline, monochrome, in a square tile.
//
// Nothing here is invented. TRACES only holds rhythms from public runs. Private audience
// rhythms render on their own cards but never become a reusable profile mark. TRACE_LOOKED records the handles this page
// really queried, so the words "no grind yet" are only ever said about an account we looked for.
const TRACES={}, TRACE_LOOKED={}, TRACE_AGENT={};
const traceKey=h=>String(h||'').toLowerCase();
// scope is what the query could see: 'all' only on your own runs, where private ones are read
// too. Everywhere else the page can only prove there is no PUBLIC grind, and says exactly that.
function noteLooked(handles,scope){ (handles||[]).forEach(h=>{ if(!h) return;
  const k=traceKey(h); if(scope==='all'||!TRACE_LOOKED[k]) TRACE_LOOKED[k]=scope||'public'; }); }
// A profile is an agent because its own row says so (rig.agent === true), never because a name
// or a null auth_uid looked like one. No row sets it today; the rule is here, unfired.
const isAgentProfile=p=>!!(p&&p.rig&&p.rig.agent===true);
function noteTraces(runs){
  (runs||[]).forEach(r=>{
    if(!r||r.visibility!=='public') return;
    const p=r.profiles||{}, h=profileHandle(p); if(!h) return;
    const k=traceKey(h); if(!TRACE_LOOKED[k]) TRACE_LOOKED[k]='public';
    if(isAgentProfile(p)) TRACE_AGENT[k]=true;
    if(!r.rhythm||!r.rhythm.length) return;
    const at=r.created_at||'';
    if(!TRACES[k]||at>=TRACES[k].at) TRACES[k]={rhythm:r.rhythm,at:at};
  });
}
// Bucket MAX, not mean: a tile 26px wide cannot draw 90 minutes, and averaging turns a spiky
// session into a hill that looks like everyone else's. The peaks are the identity.
function traceBuckets(rhythm,cols){
  const r=(rhythm||[]).map(v=>Number(v)||0);
  if(!r.length) return null;
  let out;
  if(r.length<=cols) out=r.slice();
  else { out=[]; for(let i=0;i<cols;i++){
    const a=Math.floor(i*r.length/cols), b=Math.max(a+1,Math.floor((i+1)*r.length/cols));
    out.push(Math.max.apply(null,r.slice(a,b))); } }
  if(out.length===1) out.push(out[0]);
  return out;
}
function traceSvg(rhythm,size,cols){
  const p=Math.max(2.5,size*0.09), b=traceBuckets(rhythm,cols);
  if(!b) return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><line class="trace empty" x1="${p}" y1="${(size/2).toFixed(1)}" x2="${(size-p).toFixed(1)}" y2="${(size/2).toFixed(1)}"/></svg>`;
  const n=b.length, mx=Math.max.apply(null,b)||1;
  const x=i=>p+(i/(n-1))*(size-2*p), y=v=>size-p-(v/mx)*(size-2*p);
  const pts=b.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><polyline class="trace" points="${pts}"/></svg>`;
}
// The whole tile, every call site. opts.rhythm is the run already on screen: the single-run page
// and the share view fetch one row, so that row's own rhythm is the trace, not a guess at the
// newest. The letter is gone, so the handle rides in aria-label.
function avatar(handle,opts){
  opts=opts||{};
  const size=opts.size||26;
  const cols=opts.cols||(size>=48?18:size>=34?14:12);
  const k=traceKey(handle), ghost=!!opts.ghost;
  const rhythm=ghost?null:((opts.rhythm&&opts.rhythm.length)?opts.rhythm:(TRACES[k]?TRACES[k].rhythm:null));
  const agent=!ghost&&(opts.agent||TRACE_AGENT[k]);
  const none=TRACE_LOOKED[k]==='all'?'no grind yet':'no public grind yet';
  const label=ghost?'anonymous grinder, no trace'
    :(handle?('@'+handle+(rhythm?', grind trace':', '+none)):'no handle, no trace');
  const title=rhythm?'':(ghost?'anonymous, no trace':((handle&&TRACE_LOOKED[k])?none:''));
  return `<span class="av${opts.cls?' '+opts.cls:''}${agent?' agent':''}" role="img" aria-label="${esc(label)}"`
    +`${title?` title="${esc(title)}"`:''}>${traceSvg(rhythm,size,cols)}</span>`;

// VERIFIED PER TURN — the headline. (verified claims + artifacts produced) ÷ prompts typed.
// Prompts are the COST (the denominator), never the headline. A part the row does not carry
// prints an em-dash whose tooltip names who owns it; a missing part is never defaulted to 0.
const VPT_TIP='verified per turn = (verified claims + artifacts produced) ÷ typed turns · the claim rule reads precision 0.63 and recall 0.66 on a held-out hand-labelled set, blended across three harnesses and one of the three is not measured, see /methodology · a rate, not a count: a count of claims moves with how much the agent talks';
const VPT_SRC={
  claims_verified:'claims that had matching evidence inside their own turn. What counts as a claim is measured: precision 0.63, recall 0.66 on a held-out hand-labelled set (/methodology). That figure blends three harnesses: Claude Code reads 0.72, Cursor is not resolved and carries a third of the weight. Whether a claim was matched to the right evidence is not measured yet',
  artifacts_produced:'produced is measured: files the run wrote that exist on disk. Promised is not measured yet: nothing records what a run said it would deliver, so you cannot supply it today',
  corrections:'not measured yet: it needs every turn labelled as undoing the one before it, and no harness records that, so nothing on your machine can supply it today',
  reach:'did the output cross to a person who is not the author: read from the commits in the window, your remotes and their push refs. A dash whenever the machine cannot tell'};
function vpt(r){
  const v=r.claims_verified, a=r.artifacts_produced, p=r.prompts;
  if(v==null||a==null||!p) return null;
  return (v+a)/p;
}
function vptFormula(r){
  const x=vpt(r); if(x!=null) return `(${r.claims_verified} verified + ${r.artifacts_produced} artifacts) ÷ ${r.prompts} typed turns`;
  const miss=[]; if(r.claims_verified==null) miss.push('verified claims'); if(r.artifacts_produced==null) miss.push('artifacts produced'); if(!r.prompts) miss.push('typed turns');
  return 'needs '+miss.join(', ');
}
function vptText(r){ const x=vpt(r); return x==null?'—':x.toFixed(2); }
function vptHtml(r){

}

  const corr=(r.corrections!=null&&r.prompts)?`${Math.round(100*r.corrections/r.prompts)}%`:'—';

}

function vibeForRun(r){
  const p=r.prompts||0, t=r.tool_calls||0, c=r.commits??null, regs=r.route?new Set(r.route).size:0;
  if(p<=3&&t>=40) return ['MAIN CHARACTER',`${p} prompts. The agent did the rest.`];
  if(p>=1&&t/p>=22) return ['FERAL','High tool-to-prompt ratio. Harness parkour.'];
  if(p>=20&&t/p<6) return ['TOUCH GRASS','You typed a lot. The agent barely moved.'];

function curve(r){ r=(r&&r.length)?r:[1]; const w=800,h=60,p=6,n=r.length,mx=Math.max(...r)||1;
  const x=i=>(i/Math.max(n-1,1))*w, y=v=>h-p-(v/mx)*(h-2*p);
  const pts=r.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<div class="tw"><svg class="curve" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="base" x1="0" y1="${h-p}" x2="${w}" y2="${h-p}"/><polyline class="tl" points="${pts}"/></svg></div>`; }

function routeMap(route){ if(!route||!route.length) return '';
  const w=800,h=74,pad=10,n=route.length,R=Math.max(...route)+1;
  const bandH=(h-2*pad)/Math.max(R,1);
  const x=i=>i*w/Math.max(n-1,1), y=r=>pad+bandH*(r+0.5);
  let bands=''; for(let r=0;r<R;r++){ bands+=`<line x1="0" x2="${w}" y1="${y(r).toFixed(1)}" y2="${y(r).toFixed(1)}" class="base"/>`; }
  const pts=route.map((r,i)=>`${x(i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
  const dots=route.map((r,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(r).toFixed(1)}" r="2.2" fill="var(--blue)"/>`).join('');
  return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:74px">${bands}<polyline points="${pts}" fill="none" stroke="#c6c6c1" stroke-width="1.2" stroke-linejoin="round"/>${dots}</svg>
    <div class="meta" style="padding:6px 0 0">${R} region${R==1?'':'s'} of the codebase, in the order the run touched them</div></div>`; }

function parseCoachExperiment(r){

    const friction=grab('friction:');
    const instruction=grab('experiment:')||lines[0]||'';
    const expected=grab('look for:');
    if(instruction) exp={title:instruction.slice(0,160), instruction, expected:expected||'Record what you observed. Unknown stays unknown.', friction, consequence:grab('consequence:'), evidence:''};

function wireKudos(){
  document.querySelectorAll('.copy-run-prompt:not([data-wired])').forEach(b=>{b.dataset.wired='true';b.addEventListener('click',async()=>{

  const runId=b.dataset.run;

function wireAckPicker(card,r,selected){
  let reason=selected;
  card.querySelectorAll('.ack-chip').forEach(ch=>ch.addEventListener('click',()=>{
    reason=ch.dataset.reason;
    card.querySelectorAll('.ack-chip').forEach(x=>x.classList.toggle('on',x===ch));
    const send=card.querySelector('.ack-send'); if(send) send.disabled=!reason;
  }));
  const cancel=card.querySelector('.ack-cancel');
  if(cancel) cancel.addEventListener('click',()=>{ const p=card.querySelector('.ack-picker'); if(p)p.remove(); });
  const send=card.querySelector('.ack-send');
  if(send) send.addEventListener('click',async()=>{
    if(!reason)return;
    if(await submitAck(r.id,r.profile_id,reason)){
      const p=card.querySelector('.ack-picker'); if(p)p.remove();
      const btn=card.querySelector('.kudo');
      if(btn){btn.classList.add('on','pop'); btn.firstChild.textContent='ACKed ';}
      if(location.search.includes('run=')) viewRun(r.id);
    }
  });
}

function harnessLabel(h){

  if(s.includes('fleet')||s.includes('night')) return 'Fleet';
  return h||'agent';
}
function compareAgents(runs){
  if(!runs||runs.length<2) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0,commits:0};
    by[h].runs++; by[h].prompts+=r.prompts||0;
    by[h].minutes+=Math.round((r.duration_s||0)/60);
    by[h].commits+=r.commits||0;
  });
  const keys=Object.keys(by);
  if(keys.length<2) return '';
  const rows=keys.sort((a,b)=>by[b].runs-by[a].runs).map(h=>{
    const b=by[h];
    return `<div class="p-row"><span style="font-weight:500">${esc(h)}</span><span class="v">${b.runs} runs · ${b.prompts} prompts · ${b.minutes}m · ${b.commits} commits</span></div>`;
  }).join('');
  return `<div class="head"><h2>Flex · across agents</h2><span class="meta">${keys.length} rigs</span></div><div class="panel">${rows}</div>`;
}
function coachLine(runs){
  if(!runs||!runs.length) return '';
  const by={};
  runs.forEach(r=>{
    const h=harnessLabel(r.harness);
    if(!by[h]) by[h]={runs:0,prompts:0,minutes:0};
    by[h].runs++; by[h].prompts+=r.prompts||0; by[h].minutes+=Math.round((r.duration_s||0)/60);
  });
  const keys=Object.keys(by);
  if(keys.length<2){
    return `<p class="hint" style="margin:0 0 16px">Post from Claude and Cursor to flex across agents: agentgrinder flex, on your machine.</p>`;
  }
  const top=keys.sort((a,b)=>(by[b].prompts/by[b].runs)-(by[a].prompts/by[a].runs))[0];
  const avg=Math.round(by[top].prompts/by[top].runs);
  return `<p class="hint" style="margin:0 0 16px">Your deepest sits: <b style="color:var(--ink);font-weight:500">${esc(top)}</b>, ${avg} prompts per run. Flex the rest: agentgrinder grind --harness auto --push.</p>`;
}

function shareCurveSvg(rhythm,w=420,h=100){
  const r=(rhythm&&rhythm.length)?rhythm:[1],p=6,mx=Math.max(...r)||1,n=r.length;

  const pts=r.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const poly=`${p},${h-p} ${pts} ${w-p},${h-p}`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"><line class="base" x1="0" y1="${h-p}" x2="${w}" y2="${h-p}"/><polyline class="tl" points="${pts}"/></svg>`;
}

function vptTotals(R){
  const full=R.filter(r=>r.claims_verified!=null&&r.artifacts_produced!=null&&r.prompts);
  const num=full.reduce((a,r)=>a+r.claims_verified+r.artifacts_produced,0), den=full.reduce((a,r)=>a+r.prompts,0);

// The number counts up to the value it already prints. `data-dec` is the decimal count the
// real number carries: without it a 3.67 would land on 3.7 and the card would show a number
// nobody measured.
function countUp(){ document.querySelectorAll('[data-count]').forEach(el=>{
  const target=parseFloat(el.getAttribute('data-count')); if(isNaN(target)) return;
  const dec=el.dataset.dec!=null?parseInt(el.dataset.dec):(target%1!==0?1:0);
  const dur=520, t0=performance.now();
  function step(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step); }); }
// a whole number gets a count-up; a composite like "3/7 · 43%" or a dash never does.
const cnt=v=>/^\d+$/.test(String(v))?` data-count="${v}"`:'';

// The five tools and the three modes, in words, with no account. Named exactly as the code names
// them, so a reader can grep agentgrinder/coach/tools.py and agentgrinder/coach/agent.py.
function howItWorks(){
  const tools=[
    ['read_run','cuts the sitting out of the transcript, counts the typed turns, and lists every claim line and every file the run wrote.'],
    ['check_claim','looks for evidence in the same typed turn as the claim and returns the matching tool result, or says there was none.'],
    ['verify_artifact','asks the disk whether the file exists, how big it is, and whether it was written inside the sitting.'],
    ['git_evidence','asks git which commits inside the sitting carry the file, and the first commit after it that did.'],
    ['write_verdict','writes the paragraph and the next-session plan, and refuses any number no tool in that run returned.']];
  const modes=[
    ['local','the default. A real Strands agent loop over the five tools, driven by a scripted local model. Keyless, no network, no spend.'],
    ['bedrock','opt in. The same loop with a real model on Amazon Bedrock. Needs AWS credentials, costs money, and sends the claim lines off your machine. The command says so before it runs.'],
    ['none','no agent. The five tools called in a fixed order.']];
  const row=(k,v)=>`<div class="g-row"><b style="font-weight:500">${esc(k)}</b>
    <div class="meta" style="margin-top:3px">${esc(v)}</div></div>`;
  return `<div class="head"><h2>How it works</h2><span class="meta">the coach, in words</span></div>
  <div class="panel"><div class="p-top"><span class="t">The five tools the coach calls</span></div>
    ${tools.map(t=>row(t[0],t[1])).join('')}</div>
  <div class="panel"><div class="p-top"><span class="t">Three modes, and the mode is always printed</span></div>
    ${modes.map(m=>row(m[0],m[1])).join('')}
    <div class="g-row meta">A mode that fails does not fall back quietly. The run is marked <b style="color:var(--ink);font-weight:500">DEGRADED</b>, and the screen names the failure, the reason, and the mode it fell back to.</div></div>`;
}

// The command a stranger runs, exactly as they run it. One click copies it.
//
// It used to be `... && pip install -e . && agentgrinder grind --coach`. Measured on a stock Mac
// (3 Sep 2026): `/usr/bin/python3` is 3.9.6 and ships pip 21.2.4, which predates PEP 660 and
// refuses an editable install of a pyproject-only project. The chain died at the third command
// with exit 1, so the first thing anyone did from this page failed. There is no install in the
// line any more, because the package needs none: it runs from the clone on the python macOS
// already has. The coach is a second, honest line — it needs Python 3.10 or newer, and says so.

// The coach reading the sitting, one tool at a time. Every line is a column of the run row that
// is on screen below it. No line is invented: a part the row does not carry says so in words,
// and the per-tool durations of the mock are not rendered because no column holds them.
function coachStrip(r){
  if(!r) return '';
  const rows=[
    ['read_run', `${r.prompts??'—'} typed turns, ${r.claims??'—'} claim lines`],
    ['check_claim', (r.claims_verified!=null&&r.claims!=null)?`${r.claims_verified} of ${r.claims} claims had evidence in their own turn`:'every claim tested against its own turn'],
    ['verify_artifact', r.artifacts_produced!=null?`${r.artifacts_produced} files the run wrote exist on disk`:'every file tested against the disk'],
    ['git_evidence', r.commits!=null?`${r.commits} commits inside the sitting`:'every file tested against git'],
    ['write_verdict', r.coach_tool_calls?`verdict written, ${r.coach_tool_calls} tool calls`:'verdict written']];
  const dm=r.duration_s?Math.round(r.duration_s/60):0;
  const head=[dm?fmtDur(dm):'',r.harness].filter(Boolean).join(' · ');
  return `<div class="check" id="check">
    <div class="check-top">${avatar(profileHandle(r.profiles),{rhythm:r.rhythm})}
      <span class="t">${esc(head||'a real sitting')}</span><span class="s" id="st">reading</span></div>
    ${rows.map((t,i)=>`<div class="step" data-s="${i}"><span class="i"></span><span class="n">${esc(t[0])}</span><span class="o">${esc(t[1])}</span></div>`).join('')}</div>`;
}
let _stripRun=false;
function playStrip(){
  const steps=[...document.querySelectorAll('#check .step')], st=document.getElementById('st');
  if(!steps.length) return;
  if(_stripRun){ steps.forEach(x=>x.classList.add('done')); if(st) st.textContent=steps[steps.length-1].querySelector('.o').textContent; return; }
  _stripRun=true;
  steps.forEach((x,i)=>setTimeout(()=>{ x.classList.add('done');
    if(st) st.textContent = i===steps.length-1 ? x.querySelector('.o').textContent : x.querySelector('.n').textContent; },320+i*520));
}
function wireCopy(){
  const b=document.getElementById('cp1'); if(!b) return;
  b.addEventListener('click',()=>{ navigator.clipboard&&navigator.clipboard.writeText(INSTALL_CMD);

}

async function mountCoachExperiment(run, slot){
  if(!slot) return;
  const exp=parseCoachExperiment(run);
  if(!exp){ slot.innerHTML=''; return; }
  const owner=ME&&ME.id===run.profile_id;
  const canFreeze=owner&&run.measurement_revision;
  slot.innerHTML=`<section class="panel reply-form"><p class="meta">NEXT EXPERIMENT</p>
    <h2>${esc(exp.title||'One change for the next sitting')}</h2>
    ${exp.friction?`<p>${esc(exp.friction)}</p>`:''}
    ${exp.consequence?`<p class="hint">${esc(exp.consequence)}</p>`:''}
    <p>${esc(exp.instruction)}</p>
    <p><strong>Look for:</strong> ${esc(exp.expected)}</p>
    ${coachModeBanner(run)}
    ${owner?`<form id="run-experiment">${canFreeze?'':'<p>A measured revision is required before you can freeze this grind as a baseline.</p>'}
      <label>What will you do?<input name="title" required maxlength="160" value="${esc(exp.title||'')}"></label>
      <label>How, exactly?<textarea name="instruction" required maxlength="4000">${esc(exp.instruction)}</textarea></label>
      <label>What would change your mind?<textarea name="expected" required maxlength="2000">${esc(exp.expected)}</textarea></label>
      <p>Saves a private practice and freezes this grind as its baseline. A later sitting is compared only when the measurements mean the same thing.</p>
      <button ${canFreeze?'':'disabled'}>Accept experiment and freeze baseline</button></form>`:'<p class="hint">The owner can freeze this as a private next practice. You can keep a public moment on your own baseline below.</p>'}</section>`;
  const form=slot.querySelector('#run-experiment');
  if(!form) return;
  form.onsubmit=async e=>{
    e.preventDefault();
    if(!ME||!canFreeze) return;
    const button=form.querySelector('button'); button.disabled=true;
    try{
      const f=form.elements;
      const {data,error}=await sb.from('grinder_practice_versions').insert({
        owner_id:ME.id, source_run:run.id, title:f.title.value, task_context:'Coach experiment on this grind',
        instruction:f.instruction.value, expected:f.expected.value, harness:run.harness||null, visibility:'private'
      }).select('id');
      if(error) throw error;
      const id=data[0].id;
      const started=await sb.rpc('grinder_start_attempt',{practice:id, baseline_run:run.id, share:false});
      if(started.error) throw started.error;
      location.href='/?practice='+id;
    }catch(err){ status(GrinderContract.message(err),true); button.disabled=false; }
  };
}

    app.append(controls);$('run-caption').value=r.caption||r.note||'';$('run-output-url').value=r.output_url||'';$('run-audience').value=r.visibility==='anonymous'?'private':r.visibility;
    $('run-save').onclick=async()=>{const caption=$('run-caption').value.trim(),output=$('run-output-url').value.trim();if(output&&!safeOutputUrl(output)){status('The output link must start with http:// or https://.',true);return}const {error}=await sb.from('runs').update({caption:caption||null,output_url:output||null,visibility:$('run-audience').value}).eq('id',r.id);if(error){status(error.message,true);return}await viewRun(r.id)};

function wireComposer(){
  const pb=$('publish'); if(!pb)return;
  const fields=['f_title','f_project','f_model','f_segment','f_wall','f_caption','f_output_url','f_prompts','f_dur','f_commits','f_vis'];
  const key='ag_manual_post_draft';
  let attemptId=crypto.randomUUID();
  try{
    const saved=JSON.parse(sessionStorage.getItem(key)||'null');
    if(saved?.profileId===ME?.id&&typeof saved.id==='string'){
      attemptId=saved.id;
      for(const id of fields)if(typeof saved[id]==='string')$(id).value=saved[id];
    }
  }catch(_){}
  function keepDraft(){try{sessionStorage.setItem(key,JSON.stringify({id:attemptId,profileId:ME?.id,...Object.fromEntries(fields.map(id=>[id,$(id).value]))}))}catch(_){}}
  function clearDraft(){try{sessionStorage.removeItem(key)}catch(_){}}
  fields.forEach(id=>$(id)?.addEventListener('input',keepDraft));
  pb.addEventListener('click',async()=>{ if(!ME)return;
    const title=$('f_title').value.trim(),caption=$('f_caption').value.trim(),audience=$('f_vis').value,output=$('f_output_url').value.trim();
    const wallTime=optionalWholeNumber('f_wall');
    if(!title||!caption||!audience){status('Add a title and caption, then choose who can see the run.',true);return}
    if(Number.isNaN(wallTime)){status('Segment wall time must be a whole number of seconds.',true);return}
    if(output&&!safeOutputUrl(output)){status('The output link must start with http:// or https://.',true);return}
    keepDraft();
    pb.disabled=true;
    const recover=$('manual-recover');recover.hidden=true;recover.innerHTML='';
    const openExisting=async prior=>{
      clearDraft();
      history.replaceState(null,'','/?run='+prior.id);
      status('This save was already received as '+(prior.visibility==='private'?'Only me':prior.visibility==='link'?'Anyone with the link':'Public')+'. Opening the existing run; no duplicate was created.');
      await viewRun(prior.id);
    };
    const existing=async()=>{
      const {data,error}=await sb.from('runs').select('id,visibility').eq('id',attemptId).eq('profile_id',ME.id).limit(1);
      if(error)throw error;
      return data?.[0]||null;
    };
    const showRecovery=error=>{
      const message=typeof GrinderContract==='object'&&GrinderContract.message?GrinderContract.message(error):String(error?.message||error||'The save did not complete.');
      recover.innerHTML='<div class="card" role="alert"><p><b>Save not confirmed.</b> '+esc(message)+'</p><p>This page cannot tell whether the service received the run. Your draft and audience are kept. Check and try again looks for this exact save first, so it will open an existing run instead of posting a duplicate.</p><div class="cta"><button type="button" id="manual-retry">Check and try again</button><a class="act" href="/?mine">Your runs</a></div></div>';
      recover.hidden=false;
      $('manual-retry').onclick=()=>{recover.hidden=true;pb.click()};
      status('Save not confirmed. Your draft is still here.',true);
    };
    try{
      const prior=await existing();
      if(prior){await openExisting(prior);return}
    }catch(error){showRecovery(error);pb.disabled=false;return}
    const row={id:attemptId,profile_id:ME.id,title,project:$('f_project').value||null,model:$('f_model').value.trim()||null,
      segment_id:$('f_segment').value||null,wall_time_s:wallTime,
      harness:null,prompts:+$('f_prompts').value||null,duration_s:(+$('f_dur').value||0)*60||null,commits:+$('f_commits').value||null,
      caption,output_url:output||null,visibility:audience,started_at:new Date().toISOString()};
    // Segment columns (migration supabase/strava/001_segments.sql) are only sent when set,
    // so posting keeps working on a database that does not have them yet.
    dropNullSegmentColumns(row);
    let data,error;
    try{({data,error}=await sb.from('runs').insert(row).select('id').single())}catch(unexpected){error=unexpected}
    pb.disabled=false;
    if(error){
      if(error.code==='23505'){try{const prior=await existing();if(prior){await openExisting(prior);return}}catch(_){}}
      showRecovery(error);return;
    }
    clearDraft();
    history.replaceState(null,'','/?run='+data.id);
    status(audience==='private'?'Saved for Only me. Only you can see it.':audience==='close_friends'?'Saved for Close friends. People on your list can read it.':audience==='link'?'Saved for anyone with the link. Copy the URL when you are ready.':'Saved to Public feed and profile. Copy the public link or open the share card.');
    viewRun(data.id);
  });
}

async function refreshAuth(){
  if(!auth)return;
  try{
    const current=await auth.current();ME=current.profile;IDENTITY_SETUP=current.needsOnboarding?current:null;
    $('me').innerHTML=ME?'<a href="'+GrinderAuth.present(ME).url+'">@'+esc(profileHandle(ME))+'</a>':'';

// The publish payload survives the OAuth round trip in sessionStorage, because it cannot survive
// it in the URL. Written before the redirect, read back and put on the URL before route() looks
// at location.hash. route() runs twice after a redirect (refreshAuth, then onAuthStateChange);
// the hash is written before the stash is cleared, so the second pass still finds the payload.
const IMPORT_STASH='ag_import';
function stashImport(payload){ try{ sessionStorage.setItem(IMPORT_STASH,payload);return sessionStorage.getItem(IMPORT_STASH)===payload; }catch(_){return false;} }
function restoreImport(){
  let stash=null; try{ stash=sessionStorage.getItem(IMPORT_STASH); }catch(_){ return; }
  if(!stash) return;
  if(!/import=/.test(location.hash)) history.replaceState(null,'','/#import='+stash);
  try{ sessionStorage.removeItem(IMPORT_STASH); }catch(_){}
}

  }

  const app=$('app');
  const rows=[['harness',run.harness],['model',run.model],['project',importedProject],['typed turns',run.turns_typed],

    ['shell calls',run.shell_calls],['files',run.files_touched],['commits',run.commits],
    ['verified claims',run.claims_verified!=null&&run.claims!=null?`${run.claims_verified}/${run.claims}`:null],
    ['artifacts produced',run.artifacts_produced],
    ['reach',run.reach==null?null:(run.reach?'yes':'no')],
    ['coach verdict',run.coach_verdict?String(run.coach_verdict):null],
    ['coach mode',run.coach_mode],
    ['coach tool calls',run.coach_tool_calls],
    ['vs your last grind',run.progress_verdict],
    ['measurement reference',run.measurement_revision],
    ['baseline reference',run.baseline_revision]].filter(r=>r[1]!=null&&r[1]!=='');
  frame(null,null);
  app.innerHTML=`<div class="head"><h2>${sample?'Sample preview':'Preview your run'}</h2><span class="meta">${sample?'example data · not your activity':'private until you choose and save'}</span></div>
    ${sample?'<p role="note">This sample is for trying the preview. It cannot be saved or posted. Capture your own session to share a run.</p>':''}
    <div class="panel"><div class="pad preview-story">
    <p class="meta">STORY FIRST</p>
    <label>What did you achieve?<input id="i_title" maxlength="120" required placeholder="Write the achievement. Prompt text is never used."></label>
    <label>Short caption<textarea id="i_caption" maxlength="280" required placeholder="What changed in this session?"></textarea></label>
    <label>Link to what was built (optional)<input id="i_output_url" type="url" maxlength="2048" placeholder="https://github.com/…"></label>
    <label>Who can see this run?<select id="i_vis" required><option value="" selected disabled>Choose an audience</option><option value="private">Only me — just you</option><option value="close_friends">Close friends — people on your private list</option><option value="link">Link — anyone with the URL</option><option value="public">Public — Feed and profile</option></select></label>
    <p class="hint">Only me stays with you. Close friends is your private list. Link is unlisted but readable by anyone with the URL. Choosing Public is the deliberate action that adds the run to Feed and your profile.</p>
    <button id="i_pub" ${sample?'disabled':''}>${sample?'Sample — preview only':(ME?'Save run':'Sign in to save')}</button>
    <details class="preview-details"><summary>Review recorded measurements and optional details</summary>
      <p class="hint export-contents">${sample?'This sample':'This export'} carries: the project folder name, counts, timing, the activity trace${run.ridge?', ridge bins and worker counts':''}${run.coach_verdict||run.coach_plan||run.coach_experiment?", the coach's sentences":''}${run.progress_verdict!=null||run.progress_delta!=null?', progress notes':''}${run.reach!=null||run.reach_reason?', a reach flag'+(run.reach_reason?' and reason':''):''}${run.rig_notes?', the stack notes you wrote':''}${run.activity_label?', an activity label':''}${run.route?', route metadata':''}${run.measurement_revision||run.baseline_revision?', measurement references':''}${run.rig_mcps!=null||run.rig_skills!=null?', how many MCPs and skills your rig has':''}. It never carries prompts, code or file paths. MCP names travel only if you tick the box below. Rig counts and notes are saved to your profile even when the run is Only me. Unknown measurements stay unknown.</p>
      <div class="panel">${rows.map(r=>`<div class="p-row"><span>${r[0]}</span><span class="v"><b>${esc(String(r[1]))}</b></span></div>`).join('')}</div>
      <details><summary>Inspect all imported fields</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(run,null,2))}</pre></details>
      <label>Model (optional)<input id="i_model" maxlength="120" value="${esc(run.model||'')}" placeholder="Model name"></label>
      <label>Segment (optional)<select id="i_segment"><option value="">No segment</option></select></label>
      <label>Segment wall time in seconds (optional)<input id="i_wall" type="number" min="0" step="1"></label>
      <label style="display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--muted)">
        <input type="checkbox" id="i_share_rig" ${run.rig_share_names?'checked':''}> Share MCP names on my rig (opt-in)
      </label>
      <input id="i_stack" aria-label="Stack notes for friends (optional)" placeholder="stack notes for friends (optional)" value="${esc(run.rig_notes||'')}">
    </details>
    <div id="i_recover" hidden></div></div></div>
    <div class="head"><h2>${sample?'Sample card preview':'Card preview'}</h2><span class="meta">not posted</span></div><div id="import-card-preview"></div>`;
  const editFields=['i_title','i_model','i_segment','i_wall','i_caption','i_output_url','i_stack','i_vis'];
  let savedImportEdits=null;
  try{const saved=JSON.parse(sessionStorage.getItem('ag_import_edits')||'null');if(saved?.token===m[1]){savedImportEdits=saved;for(const key of editFields)if(typeof saved[key]==='string')$(key).value=saved[key];$('i_share_rig').checked=!!saved.shareRig}}catch(_){}
  function saveImportEdits(){try{sessionStorage.setItem('ag_import_edits',JSON.stringify({token:m[1],...Object.fromEntries(editFields.map(key=>[key,$(key).value])),shareRig:$('i_share_rig').checked}))}catch(_){}}
  function paintImportPreview(){
    const preview={id:'preview',profile_id:ME?.id||'preview',profiles:ME||{github_handle:'you',name:'Your preview'},title:$('i_title').value||'Untitled run',
      project:importedProject,model:$('i_model').value.trim()||null,segment_id:$('i_segment').value||null,
      wall_time_s:importedWholeNumber('i_wall'),
      harness:run.harness||null,prompts:run.turns_typed??null,duration_s:run.duration_s??null,
      commits:run.commits??null,tool_calls:run.tool_calls??null,shell_calls:run.shell_calls??null,files_touched:run.files_touched??null,artifacts_produced:run.artifacts_produced??null,
      rhythm:run.rhythm||null,trace_basis:run.trace_basis||null,caption:$('i_caption').value||null,output_url:$('i_output_url').value||null,
      ridge:run.ridge||null,ridge_basis:run.ridge_basis||null,ridge_wall_seconds:run.ridge_wall_seconds??null,
      worker_bins:run.worker_bins||null,commit_bins:run.commit_bins||null,
      visibility:'private',started_at:run.started||null,created_at:new Date().toISOString()};
    $('import-card-preview').innerHTML=runCard(preview,false,0,{preview:true});
  }
  editFields.forEach(key=>$(key).addEventListener('input',()=>{saveImportEdits();paintImportPreview()}));
  paintImportPreview();
  if(typeof loadSegmentChoices==='function') loadSegmentChoices('i_segment',savedImportEdits?.i_segment).then(paintImportPreview);
  $('i_pub').addEventListener('click',async()=>{
    if(sample){status('Samples are preview-only. Capture your own session to save a run.',true);return;}
    saveImportEdits();
    const publishButton=$('i_pub');
    if(publishButton.disabled)return;

    // SIGN-IN USED TO DESTROY THE RUN IT WAS CALLED TO PUBLISH. The whole payload lives in the
    // URL fragment (#import=<base64>) and this call passed `redirectTo: location.href`. RFC 6749
    // 3.1.2 forbids a fragment in an OAuth redirect_uri, so the provider drops it: the user came
    // back signed in, on an empty profile, with the run gone and no way to get it back short of
    // re-running the command. Stash it before leaving, put it back in route() on the way in.
    if(!ME){ stashImport(m[1]);
      showSignIn(); return; }
    const caption=$('i_caption').value.trim(),output=$('i_output_url').value.trim(),audience=$('i_vis').value,wallTime=importedWholeNumber('i_wall');
    if(!$('i_title').value.trim()||!caption||!audience){status('Add a title and caption, then choose who can see the run.',true);return}
    if(Number.isNaN(wallTime)){status('Segment wall time must be a whole number of seconds.',true);return}
    if(output&&!safeOutputUrl(output)){status('The output link must start with http:// or https://.',true);return}
    publishButton.disabled=true;
    const recover=$('i_recover'); recover.hidden=true; recover.innerHTML='';
    // The same capture saved twice is one run, not two. Only the capture's measurement
    // reference is a safe key: start time + harness alone can match two different projects.
    // A retry after a lost response finds the row the first attempt made. The database unique
    // index on (profile_id, measurement_revision) arbitrates concurrent inserts (23505).
    // Nothing here re-sends on its own.
    const dedupe=run.measurement_revision?{measurement_revision:run.measurement_revision}:null;
    async function existingRun(){ if(!dedupe) return null; let q=sb.from('runs').select('id,visibility').eq('profile_id',ME.id); for(const [k,v] of Object.entries(dedupe)) q=q.eq(k,v); const {data,error}=await q.order('created_at',{ascending:true}).limit(1); if(error) throw error; return (data&&data[0])||null; }
    function openExisting(prior){
      try{sessionStorage.removeItem('ag_import');sessionStorage.removeItem('ag_import_edits')}catch(_){}
      history.replaceState(null,'','/?run='+prior.id);
      status('This capture was already saved as a run ('+audienceLabel(prior.visibility)+'). Opening it. The caption you typed here was not applied; edit it on the run if you want it.');
      return viewRun(prior.id);
    }
    function showRecovery(error){
      const text=String(error?.message||error||'');
      const offline=/failed to fetch|networkerror|load failed|network request failed|fetch failed/i.test(text);
      const why=offline?'The service could not be reached.':(typeof GrinderContract==='object'&&GrinderContract.message?GrinderContract.message(error):text)||'The save did not complete.';
      recover.innerHTML='<div class="card" role="alert"><p><b>Save not confirmed.</b> '+esc(why)+'</p><p>This page cannot tell whether the service received the run. Your title, caption, link and audience are kept on this page'+(dedupe?', and pressing Check and try again first looks for this capture, so it cannot be posted twice.':'. This export has no session reference, so open Your runs before saving again to be sure it is not there already.')+'</p><div class="cta"><button type="button" id="i_retry">Check and try again</button><a class="act" href="/?mine">Your runs</a></div></div>';
      recover.hidden=false;
      $('i_retry').onclick=()=>{recover.hidden=true;publishButton.click()};
      status('Save not confirmed. Your draft is still here.',true);
    }
    try{
    let prior=null;
    try{ prior=await existingRun(); }catch(lookupError){ showRecovery(lookupError); return; }
    if(prior){ await openExisting(prior); return; }
    const base={profile_id:ME.id,title:$('i_title').value||'Untitled run',
      project:importedProject,model:$('i_model').value.trim()||null,segment_id:$('i_segment').value||null,
      wall_time_s:wallTime,
      harness:run.harness||null,prompts:run.turns_typed??null,duration_s:run.duration_s??null,
      commits:run.commits??null,tool_calls:run.tool_calls??null,shell_calls:run.shell_calls??null,files_touched:run.files_touched??null,
      rhythm:run.rhythm||null,caption,output_url:output||null,visibility:audience,started_at:run.started||null};
    dropNullSegmentColumns(base);
    // the coach columns (nullable; migration 2026-09-03-coach.sql). Retry without them on a
    // database that does not have them yet, and say so.
    const coach={claims:run.claims??null,claims_verified:run.claims_verified??null,artifacts_produced:run.artifacts_produced??null,
      reach:run.reach??null,
      coach_verdict:run.coach_verdict??null,coach_plan:run.coach_plan??null,coach_tool_calls:run.coach_tool_calls??null,
      coach_mode:run.coach_mode??null,
      progress_verdict:run.progress_verdict??null};
    // Persist the measurement reference whenever the export carries one, even on schema 0,
    // so a later retry can find this row. Other schema-1 fields stay gated on version.
    if(run.measurement_revision!=null) coach.measurement_revision=run.measurement_revision;
    if(run.baseline_revision!=null) coach.baseline_revision=run.baseline_revision;
    if(run.schema_version===1) Object.assign(coach,{schema_version:1,trace_basis:run.trace_basis||null,route:run.route||null,
      progress_delta:run.progress_delta??null});
    // The ridge columns (nullable; migration supabase/strava/003_ridge_persistence.sql). The
    // preview already drew this ridge from the export. Before 003 the Save dropped it and the
    // reload fell back to the legacy rhythm trace. These are the same five field names the card
    // renderer reads back (site/run-contract.js, function ridge). No silent fallback: a database
    // without the columns must fail the save loudly, not save a run with its ridge removed.
    if(run.ridge) Object.assign(coach,{ridge:run.ridge,ridge_basis:run.ridge_basis||null,
      ridge_wall_seconds:run.ridge_wall_seconds??null,worker_bins:run.worker_bins||null,
      commit_bins:run.commit_bins||null,ridge_tool_calls:run.ridge_tool_calls??null});
    let {data:published,error}=await sb.from('runs').insert({...base,...coach}).select('id').single();
    if(error&&error.code==='23505'){ let again=null; try{again=await existingRun()}catch(_){} if(again){ await openExisting(again); return; } }
    if(error){showRecovery(error);return;}
    // The run is saved from here on. A failed rig update must never read as a failed save.
    let rigNote='';
    try{
      const rig={...(ME.rig||{})};
      if(run.rig_mcps!=null) rig.mcps=run.rig_mcps;
      if(run.rig_skills!=null) rig.skills=run.rig_skills;
      const notes=$('i_stack')?.value; if(notes) rig.notes=notes;
      if($('i_share_rig')?.checked && run.rig_mcp_names){ rig.mcp_names=run.rig_mcp_names; rig.share_names=true; }
      const {error:rigError}=await sb.from('profiles').update({rig}).eq('id',ME.id);
      if(rigError) throw rigError;
    }catch(_){ rigNote=' Your rig counts and notes were not updated; edit them from your profile.'; }
    try{localStorage.setItem('ag_onboard_done','1');sessionStorage.removeItem('ag_import');sessionStorage.removeItem('ag_import_edits')}catch(_){}
    history.replaceState(null,'','/?run='+published.id);status((base.visibility==='private'?'Saved for Only me. Change the audience when you deliberately want to share.':base.visibility==='close_friends'?'Saved for Close friends. Copy its link for someone on your list.':base.visibility==='link'?'Saved for anyone with the link. Copy the URL when you are ready.':'Saved to Public feed and profile. Copy the public link or open the share card.')+rigNote);
    await viewRun(published.id);
    }catch(unexpected){showRecovery(unexpected)}finally{publishButton.disabled=false}

  });
  return true;
}

async function viewShareRun(id){
  const app=$('app'); frame(null,null,true);
  const q=new URLSearchParams(location.search);
  const {data:r,error:runError}=await sb.from('runs').select('*, profiles!runs_profile_id_fkey(github_handle,name,rig,handle,display_name,avatar_url)').eq('id',id).single();
  if(runError&&runError.code!=='PGRST116'){app.innerHTML='<div class="empty">This run could not load. Please refresh to try again.</div>';return;}
  if(!r){ app.innerHTML='<div class="empty">Run not found or private.</div>'; return; }
  let moment=null;const mid=q.get('moment');
  if(/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(mid||'')){
    const result=await sb.from('grinder_run_moments').select('*').eq('id',mid).eq('run_id',r.id).single();
    if(result.error||!result.data){app.innerHTML='<p>This moment is private, removed or unavailable. <a href="/?run='+encodeURIComponent(r.id)+'">Return to the grind</a>.</p>';return;}
    moment=result.data;
  }
  GrinderSharing.mount({run:r,slot:app,status,moment});
}

const forum=GrinderForum({client:sb,app:()=>document.getElementById('app'),frame,status});

async function route(){ account.recover();
  if(ME && social.refreshUnread) social.refreshUnread();
  if(IDENTITY_SETUP)return viewIdentitySetup();
  restoreImport();
  if(importRun()) return;
  if(ME){try{const pending=sessionStorage.getItem('ag_social_return');if(pending&&/^\?(post|mine|following|inbox|run|u|example|people|account)(=|$)/.test(pending)){history.replaceState(null,'','/'+pending);sessionStorage.removeItem('ag_social_return');}}catch(_){}}
  const q=new URLSearchParams(location.search);
  if(q.has('example')){
    if(q.get('example')==='share') return GrinderExample.viewShare();
    if(q.get('example')==='tree') return GrinderExample.viewTree();
    return GrinderExample.view();
  }
  if(q.has('community'))return viewCommunity();
  if(q.has('forum')){setPrimarySection('community');return forum.index();}
  if(q.has('segment'))return GrinderSegments.mount({client:sb,id:q.get('segment'),slot:$('app'),frame,status});
  if(q.has('post'))return viewPost();
  if(q.has('mine')){setPrimarySection('mine');return progress.history();}
  if(q.has('progress')){setPrimarySection('mine');return progress.index();}
  if(q.has('comparison')){setPrimarySection('mine');return progress.detail(q.get('comparison'));}
  if(q.has('people')){setPrimarySection('feed');return people.discover(q.get('q')||'');}
  if(q.has('account')){return account.view();}
  if(q.has('following')){setPrimarySection('feed');return social.following();}
  if(q.has('inbox')){setPrimarySection('inbox');return social.inbox();}
  if(q.has('crews')){setPrimarySection('community');return social.crews();}
  if(q.has('experiments')){setPrimarySection('mine');return practices.experiments(q.get('experiments'));}
  if(q.has('experiment')){setPrimarySection('mine');return practices.experiment(q.get('experiment'));}
  if(q.has('crew')){setPrimarySection('community');return social.crew(q.get('crew'));}
  if(q.has('join')){setPrimarySection('community');return social.join(q.get('join'));}
  if(q.has('agents')){setPrimarySection('mine');return social.agents();}
  if(q.has('agent')){setPrimarySection('mine');return social.agentProfile(q.get('agent'));}
  if(q.has('practices')){setPrimarySection('mine');return practices.index();}
  if(q.has('practice')){setPrimarySection('mine');return practices.detail(q.get('practice'));}
  if(q.has('challenges')){setPrimarySection('community');return challenges.index();}
  if(q.has('challenge')){setPrimarySection('community');return challenges.show(q.get('challenge'));}
  if(q.has('rigs')){setPrimarySection('mine');return challenges.rigs();}
  if(q.has('rigversion')){setPrimarySection('mine');return challenges.rig(q.get('rigversion'));}
  if(q.get('claim')) return viewClaim();
  if(q.get('pitch')!==null) return viewPitch();
  if(q.get('event')) return viewEvent();
  if(q.get('share')!==null){
    if(q.get('rig')) return viewShareRig(q.get('rig'));
    const u=q.get('u'); if(u) return viewShareProfile(u);
    const rn=q.get('run'); if(rn) return viewShareRun(rn);
  }
  const u=q.get('u'); const rn=q.get('run');
  if(rn) return viewRun(rn); if(u) return viewProfile(u); if(q.get('explore')!==null) return viewExplore();
  if(await shouldOnboard()) return viewOnboard();
  if(ME&&(await runCount())===0) return viewPost();
  return ME?viewMe():viewLanding(); }

document.addEventListener('DOMContentLoaded',()=>{
  $('app').innerHTML=skeletonCard();
  const account=$('account-menu');
  if(account){
    document.addEventListener('click',e=>{ if(account.open && !account.contains(e.target)) account.open=false; });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && account.open){ account.open=false; account.querySelector('summary')?.focus(); }});
  }
  $('auth').addEventListener('click',async()=>{ if(!sb){status('Refresh.',true);return;}
    const {data:{session}}=await sb.auth.getSession();
    if(session){try{await auth.signOutLocal();location.href='/';}catch(e){status(e.detail?.message||'Sign-out failed. Try again.',true)}return;}
    showSignIn(); });
  if(sb){
    // Initial session loading and SIGNED_IN can arrive together. Finish one render
    // before another auth refresh can append controls to the same page.
    let authRefresh=Promise.resolve();
    const refreshAndRoute=()=>{authRefresh=authRefresh.catch(()=>{}).then(async()=>{await refreshAuth();await route()});return authRefresh;};
    refreshAndRoute();
    sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||event==='USER_UPDATED'||(event==='SIGNED_IN'&&session?.user?.id!==ME?.auth_uid))setTimeout(refreshAndRoute,0)});
  } else route();
});
</script>
