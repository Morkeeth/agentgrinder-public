<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f7f7f5"/><g font-family="Arial, sans-serif" fill="#0a0a0a"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0047ff"/></marker></defs><text x="60" y="60" font-size="32" fill="#0a0a0a" font-weight="700">AGENT GRINDER</text><text x="60" y="97" font-size="24" fill="#0047ff" font-weight="400">Strava for agents · record → preview → post → follow → return</text><text x="60" y="164" font-size="17" fill="#6f6f6b" font-weight="700">ON THE BUILDER’S MACHINE</text><text x="890" y="164" font-size="17" fill="#6f6f6b" font-weight="700">HOSTED PRODUCT</text><rect x="60" y="190" width="690" height="130" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/><text x="82" y="224" font-size="22" fill="#0a0a0a" font-weight="700">1 · Capture the sitting</text><text x="82" y="257" font-size="18" fill="#555550" font-weight="400">Claude Code / Cursor / Codex transcripts → Python reader</text><text x="82" y="284" font-size="18" fill="#555550" font-weight="400">Typed turns, timing, tool activity, artifacts and Git evidence</text><text x="82" y="311" font-size="18" fill="#555550" font-weight="400">Creates the local run card. Missing measurements stay unknown.</text><rect x="60" y="372" width="330" height="230" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/><text x="82" y="406" font-size="22" fill="#0a0a0a" font-weight="700">2 · Optional coach</text><text x="82" y="439" font-size="18" fill="#555550" font-weight="400">Strands Agents SDK</text><text x="82" y="466" font-size="18" fill="#555550" font-weight="400">read_run · check_claim</text><text x="82" y="493" font-size="18" fill="#555550" font-weight="400">verify_artifact · git_evidence</text><text x="82" y="520" font-size="18" fill="#555550" font-weight="400">write_verdict</text><text x="82" y="547" font-size="18" fill="#555550" font-weight="400">Local scripted mode is labelled.</text><rect x="440" y="372" width="310" height="230" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/><text x="462" y="406" font-size="22" fill="#0a0a0a" font-weight="700">3 · Export for preview</text><text x="462" y="439" font-size="18" fill="#555550" font-weight="400">Run data and coach notes</text><text x="462" y="466" font-size="18" fill="#555550" font-weight="400">Raw transcript stays local.</text><text x="462" y="493" font-size="18" fill="#555550" font-weight="400">Review text before sharing.</text><text x="462" y="520" font-size="18" fill="#555550" font-weight="400">grind --push opens the app.</text><rect x="60" y="657" width="690" height="133" fill="#ffffff" stroke="#0047ff" stroke-width="2"/><text x="82" y="691" font-size="22" fill="#0a0a0a" font-weight="700">Optional Amazon Bedrock · remote</text><text x="82" y="724" font-size="18" fill="#555550" font-weight="400">Model chooses tools through the same Strands loop.</text><text x="82" y="751" font-size="18" fill="#555550" font-weight="400">Opt-in provider requests leave the machine and incur inference cost.</text><text x="82" y="778" font-size="18" fill="#555550" font-weight="400">Live model execution remains unverified in this release pass.</text><rect x="890" y="190" width="650" height="155" fill="#ffffff" stroke="#0047ff" stroke-width="2"/><text x="912" y="224" font-size="22" fill="#0a0a0a" font-weight="700">Vercel · web app + public-run endpoint</text><text x="912" y="257" font-size="18" fill="#555550" font-weight="400">Run cards, public feed, profile, follow, discussion and sharing</text><text x="912" y="284" font-size="18" fill="#555550" font-weight="400">Sign in, inspect the import preview, choose its audience</text><text x="912" y="311" font-size="18" fill="#555550" font-weight="400">The labelled sample works without an account or paid model.</text><rect x="890" y="404" width="650" height="177" fill="#ffffff" stroke="#0047ff" stroke-width="2"/><text x="912" y="438" font-size="22" fill="#0a0a0a" font-weight="700">Supabase · authentication + PostgreSQL</text><text x="912" y="471" font-size="18" fill="#555550" font-weight="400">Runs, profiles, social records, practices and reviews</text><text x="912" y="498" font-size="18" fill="#555550" font-weight="400">Row access policies; owner-only review actions</text><text x="912" y="525" font-size="18" fill="#555550" font-weight="400">Private import is hosted private data, not public publication.</text><text x="912" y="552" font-size="18" fill="#555550" font-weight="400">Only publish when the builder chooses a public audience.</text><rect x="890" y="640" width="650" height="177" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/><text x="912" y="674" font-size="22" fill="#0a0a0a" font-weight="700">Return with the next run</text><text x="912" y="707" font-size="18" fill="#555550" font-weight="400">Freeze your baseline → try one practice → review a later run</text><text x="912" y="734" font-size="18" fill="#555550" font-weight="400">Compatible measurements required; unknown is not zero.</text><text x="912" y="761" font-size="18" fill="#555550" font-weight="400">Another builder tries it on their own baseline.</text><text x="912" y="788" font-size="18" fill="#555550" font-weight="400">Source revocation preserves the adopter’s own work.</text><path d="M220,320 L220,372" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M550,320 L595,372" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M390,487 L440,487" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M750,455 L890,290" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M1215,345 L1215,404" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M1215,581 L1215,640" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)"/><path d="M220,602 L220,657" fill="none" stroke="#0047ff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="60" y="865" font-size="23" fill="#0a0a0a" font-weight="700">The card is the entry point. The coach and practice loop add depth inside the run.</text><text x="60" y="912" font-size="17" fill="#6f6f6b" font-weight="400">Release source: 469ef1f · 14 September 2026 · agentgrinder.vercel.app · github.com/Morkeeth/agentgrinder</text><text x="60" y="942" font-size="17" fill="#6f6f6b" font-weight="400">Evidence: hosted private TEST import → baseline → later run → persisted review; disposable two-builder RPC checks.</text><text x="60" y="970" font-size="17" fill="#6f6f6b" font-weight="400">No independent adoption, improvement, or live Bedrock outcome is claimed by those checks.</text></g></svg>